# no-mistakes global config for the AI Native stack (Pi Agent + Firstmate + Herdr).
# Install to ~/.no-mistakes/config.yaml with ai-native/setup.sh. Applies to every repo on this machine.
# Repo-level policy lives in each repo's .no-mistakes.yaml; start from project.no-mistakes.yaml.
# Full key reference: ~/.no-mistakes/config.yaml (generated by no-mistakes, keep for the commented schema).

# Gate agent is Pi so the whole stack uses one harness and one login.
agent: pi
forgejo_axi_path: forgejo-axi

# Model split: a cheaper model does every fix/duty turn, the stronger one only reviews.
# Change the model ids to whatever `pi` lists as available for your account.
agent_config:
  pi:
    model: anthropic/claude-sonnet-5-5
    effort: medium

review_agents:
  reviewer:
    agent: pi
    model: anthropic/claude-opus-5-5
    effort: medium
  fixer:
    agent: pi
    model: anthropic/claude-sonnet-5-5
    effort: medium

# Hard wall-clock bounds so a stalled agent fails the run instead of hanging a worker pane.
agent_timeout: "15m"
review_agent_timeout: "30m"
test_agent_timeout: "10m"
step_quiet_warning: "10m"
ci_timeout: "168h"
daemon_connect_timeout: "3s"
gate_reconcile_interval: "2m"
gate_reconcile_timeout: "30s"
branch_sync_remote_timeout: "60s"

# One durable fixer session per run; review turns always stay session-free.
session_reuse: true
log_level: info

# Auto-fix attempts per step. review stays 0: findings go to a human or the supervising firstmate,
# never silently self-approved.
auto_fix:
  rebase: 3
  lint: 3
  test: 3
  review: 0
  document: 3
  ci: 3

# A cancelled CI check may have been stopped on purpose; never rerun it automatically.
ci:
  rerun_transient: 0
  revalidate_repairs: false

# Feed the originating Pi/Claude/Codex session intent to every gate step.
intent:
  enabled: true
  threshold: 0.2
  slack_days: 3

# Keep a local corpus of review passes for `no-mistakes eval`.
eval:
  capture_provenance: true
  auto_capture: true
  max_cases: 200
  diversified_size: 32
