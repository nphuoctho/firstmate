# no-mistakes global config for the AI Native stack (Pi Agent + Firstmate + Herdr).
# Install to ~/.no-mistakes/config.yaml with ai-native/setup.sh. Applies to every repo on this machine.
# Repo-level policy lives in each repo's .no-mistakes.yaml; start from project.no-mistakes.yaml.
# Key reference: https://github.com/kunchenguid/no-mistakes docs/src/content/docs/reference/global-config.md
# Unknown keys here fail daemon config loading, unlike the repo file.

# Gate agent is Pi so the whole stack uses one harness and one login.
agent: pi
forgejo_axi_path: forgejo-axi

# Model split: a cheaper model does every fix/duty turn, the stronger one only reviews.
# Change the model ids to whatever `pi --list-models` shows for your account.
agent_config:
  pi:
    model: anthropic/claude-sonnet-5-5
    effort: medium

review_agents:
  reviewer:
    agent: pi
    model: anthropic/claude-opus-5-5
    effort: medium
  fixer:
    agent: pi
    model: anthropic/claude-sonnet-5-5
    effort: medium

# Silent-stall budgets: a turn with no output is cut here. The *_working_timeout caps let a turn
# that is still producing output or running a child process (a test suite) continue up to the cap;
# without them a busy turn is cut at the silent budget.
agent_timeout: "15m"
agent_working_timeout: "45m"
review_agent_timeout: "30m"
review_agent_working_timeout: "60m"
test_agent_timeout: "20m"
test_agent_working_timeout: "45m"
step_quiet_warning: "10m"
ci_timeout: "168h"
daemon_connect_timeout: "3s"
gate_reconcile_interval: "2m"
gate_reconcile_timeout: "30s"
branch_sync_remote_timeout: "60s"

# Parallel lanes share this one daemon: queue runs beyond this instead of starting them all at once.
max_concurrent_runs: 4

# One durable fixer session per run; review turns always stay session-free.
session_reuse: true
log_level: info

# Auto-fix attempts per step. review stays 0: findings go to a human or the supervising firstmate,
# never silently self-approved. A driver using `no-mistakes axi run --yes` bypasses this by design.
auto_fix:
  rebase: 3
  lint: 3
  test: 3
  review: 0
  ci: 3

# A cancelled CI check may have been stopped on purpose; never rerun it automatically.
ci:
  rerun_transient: 0
  revalidate_repairs: false

# Feed the originating Pi/Claude/Codex session intent to every gate step (git-push runs only;
# `axi run` requires an explicit --intent).
intent:
  enabled: true
  threshold: 0.2
  slack_days: 3

# Keep a local corpus of review passes for `no-mistakes eval`.
eval:
  capture_provenance: true
  auto_capture: true
  max_cases: 200
  diversified_size: 32

# Never point worktree_roots (or NM_HOME) under $TMPDIR: pi-lens then writes .pi-lens-probe-home/
# into the run worktree and the pipeline commits and pushes it.
