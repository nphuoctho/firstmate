# Universal per-repo no-mistakes policy for AI Native projects.
# Commit this as <repo>/.no-mistakes.yaml on the DEFAULT branch, then run `no-mistakes init`.
# commands, agent, review.*, document/test instructions, ci.*, rebase.*, protected_paths, no_ci and
# disable_project_settings are read ONLY from the default-branch copy; a feature-branch edit is ignored.
# Schema: https://github.com/kunchenguid/no-mistakes docs/src/content/docs/reference/repo-config.md
# Repo config silently ignores unknown or misspelled keys, and `no-mistakes doctor`/`status` do not
# validate this file: check spelling against the schema.

# REQUIRED: `commands` and `ignore_patterns` for this repo's stack come from stacks/<stack>.yaml.
# ai-native/new-project.sh <stack> <repo-dir> replaces the marker line below with that snippet.
# Left unset, the run worktree has no installed dependencies (no node_modules/.venv), so lint and
# tests fall to an agent that may be unable to run them, and the run can still pass.
# Commands run via `sh -c` on the daemon host; keep them non-interactive and the test targeted.
# ignore_patterns matcher: no slash = basename at any depth; "dir/**" = literal path prefix from the
# repo root; "*" never crosses "/", and "**/" is NOT a recursive wildcard ("**/dist/**" matches nothing).
# Nested build dirs need one literal entry each, e.g. "apps/web/dist/**".
# @@STACK@@

# Let the reviewer ask the supervising agent a question instead of guessing.
review:
  conversation: true
  # path_instructions:
  #   - path: "docs/**"
  #     instructions: |
  #       Prose changes only. Do not request test coverage.

# Review findings always park for a decision. A failing configured lint/test command parks too
# (its finding is ask-user), so these budgets only apply to agent-produced auto-fix findings.
auto_fix:
  review: 0
  rebase: 3
  lint: 3
  test: 3
  ci: 3

ci:
  rerun_transient: 0
  revalidate_repairs: false
  review_bot_comments: on_failure
  rebase_behind: false

rebase:
  strategy: rebase

# Stop automatic fix commits from rewriting these; the step parks for an operator instead.
# protected_paths:
#   - ".github/**"

# Enable ONLY for agent-orchestration repos (like Firstmate itself), whose AGENTS.md / CLAUDE.md would
# give a gate agent a supervisor identity. Ordinary projects want the gate agent to read them.
# disable_project_settings: true

# Set only if the repo intentionally has no CI; otherwise an empty check list is treated as not ready.
# no_ci: true

# Pull requests target the forge default branch unless you integrate elsewhere.
# pr:
#   base_branch: develop

commit:
  fix_message: "chore(no-mistakes-{{.Step}}): {{.Summary}}"

# Runbook for the Test step: how to start the app and what to exercise. Fill per repo.
# test:
#   instructions: |
#     Start the app with `pnpm dev`, then exercise the changed flow.
