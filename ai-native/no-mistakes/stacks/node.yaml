# Node and TypeScript, written for npm. The pnpm form ran through a real pipeline.
# new-project.sh swaps in pnpm, yarn or bun and drops any script the repo does not have.
# Only pass flags the test script accepts (`--run` is a Vitest flag and breaks `node --test`).
commands:
  prepare: "npm ci"
  lint: "npm run lint"
  test: "npm test"
  format: "npx prettier --write ."
ignore_patterns:
  - "*.lock"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "npm-shrinkwrap.json"
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "*.generated.*"
  - "dist/**"
  - "build/**"
  - ".next/**"
  - "coverage/**"
  - "node_modules/**"
