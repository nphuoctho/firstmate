# Shopify. UNTESTED: written from the Shopify CLI and theme-check documentation, not run (no Shopify CLI
# on the machine that wrote this file). Verify before relying on it.
# Theme repo (Liquid): `shopify theme check` (the bundled theme-check) needs the Shopify CLI on the
# PATH of the machine that runs the gate. The standalone `theme-check` gem is an alternative.
# App repo (Remix/Node): drop the theme lines and use the app's own npm scripts instead:
#   prepare: "npm ci"   lint: "npm run lint"   test: "npm test"
commands:
  lint: "shopify theme check --fail-level error"
ignore_patterns:
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "assets/*.min.*"
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - ".shopify/**"
  - "*.lock"
  - "package-lock.json"
