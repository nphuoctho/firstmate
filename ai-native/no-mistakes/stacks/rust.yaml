# Rust with cargo. Lint and test were run on a throwaway fixture and through one isolated pipeline.
# Lint includes the format check, so an unformatted file fails the gate; `cargo fmt` fixes it.
# Needs Cargo.lock committed. Without one, use plain `cargo fetch` as prepare.
commands:
  prepare: "cargo fetch --locked"
  lint: "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
  test: "cargo test"
  format: "cargo fmt"
ignore_patterns:
  - "Cargo.lock"
  - "*.lock"
  - "*.generated.*"
  - "target/**"
  - "vendor/**"
