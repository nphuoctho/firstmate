# Python with uv, ruff and pytest. Ran through a real pipeline with no-mistakes v1.106.1.
# Needs uv.lock committed (`uv sync --frozen`) and pytest in the dev dependencies.
# new-project.sh swaps `uv run` for poetry or a pip .venv, and drops ruff or pytest if the repo has no config for them.
commands:
  prepare: "uv sync --frozen"
  lint: "uv run ruff check ."
  test: "uv run pytest -q"
  format: "uv run ruff format ."
ignore_patterns:
  - "*.lock"
  - "*.generated.*"
  - "*.egg-info/**"
  - ".venv/**"
  - "dist/**"
  - "build/**"
  - "__pycache__/**"
