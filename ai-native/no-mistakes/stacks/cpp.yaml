# C / C++ with make. clang-format --dry-run and clang-tidy exercised on a throwaway fixture; the make
# test target is exercised there too. The CMake form is UNTESTED (cmake is not installed on the machine
# that wrote this file): replace the test line with
#   test: "cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure"
# Adjust the globs to the repo layout; clang-tidy reads compile_commands.json when present, else uses --extra-arg flags.
commands:
  lint: "git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -r clang-format --dry-run --Werror && git ls-files '*.c' '*.cc' '*.cpp' | xargs -r clang-tidy --warnings-as-errors='*' --quiet --extra-arg=-std=c++17"
  test: "make test"
  format: "git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -r clang-format -i"
ignore_patterns:
  - "*.o"
  - "*.a"
  - "*.so"
  - "*.generated.*"
  - "build/**"
  - "cmake-build-debug/**"
  - "third_party/**"
  - "vendor/**"
