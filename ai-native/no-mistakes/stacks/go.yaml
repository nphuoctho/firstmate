# Go. Ran through a real pipeline with no-mistakes v1.106.1.
# The lint form lists the files gofmt dislikes; a bare `test -z "$(gofmt -l .)"` fails with no output.
commands:
  prepare: "go mod download"
  lint: "gofmt -l . | (! grep .) && go vet ./..."
  test: "go test ./..."
  format: "gofmt -w ."
ignore_patterns:
  - "go.sum"
  - "*.pb.go"
  - "*.generated.*"
  - "vendor/**"
  - "bin/**"
